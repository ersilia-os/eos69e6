Title: Pharmacophore-guided molecular generation
Description: "Generates up to 1,000 molecules matching a specified pharmacophore, so that design is steered by the spatial arrangement of interacting groups rather than by resemblance to a seed compound. Zhu and colleagues coupled a pharmacophore encoder with a generative decoder, allowing a hypothesis derived from a binding site to drive construction directly. Generation is stochastic, and satisfying a pharmacophore constrains geometry without ensuring the result is synthesisable or active."
