Status: Ready
Title: Pharmacophore-guided molecular generation
Description: Derives pharmacophore hypotheses from an input ligand and builds up to
  100 new molecules that satisfy them, so design is steered by the spatial arrangement
  of interacting groups rather than by resemblance to the seed compound. Zhu and colleagues
  encoded the pharmacophore with a graph neural network and emitted molecules through
  a transformer decoder, training on over 1.25 million ChEMBL compounds. Sampling
  is stochastic and was assessed only by docking, and the original code is released
  for non-commercial use.
