Title: Pharmacophore-guided molecular generation
Description: "Based on a molecules pharmacophore, this model generates new molecules
  de-novo to match the pharmacophore.\nInternally, pharmacophore hypotheses are generated
  for a given ligand.\nA graph neural network encodes spatially distributed chemical
  features and a transformer decoder generates molecules."
