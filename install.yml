python: "3.8"
commands:
  - ['conda', 'install', '-c', 'conda-forge', ' libstdcxx-ng==15.1.0', '-y']
  - ["pip", "torch", "1.12.1", "--extra-index-url", "https://download.pytorch.org/whl/cpu"]
  - ["pip", "torchvision", "0.13.1", "--extra-index-url", "https://download.pytorch.org/whl/cpu"]
  - ["pip", "torchaudio", "0.12.1", "--extra-index-url", "https://download.pytorch.org/whl/cpu"]
  - ["pip", "fairseq", "0.10.2"]
  - ["pip", "einops", "0.6.0"]
  - ["pip", "tqdm", "4.66.2"]
  - ["pip", "rdkit", "2022.09.1"]
  - ["pip", "pandas", "2.0.3"]
  - ['conda', 'install', '-y', '-c', 'dglteam', ' dgl=0.9.1']
  - ['conda', 'install', '-y', '-c', 'conda-forge', ' numpy==1.19.5']
